
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 30px 5%;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #0f172a, #d0d0d8, #eee9ee);
}

.page-title {
    text-align: center;
    font-size: 36px;
    margin-bottom: 35px;
    color: #fff;
    text-shadow: 0 0 20px #c084fc;
}

/* KARTOCHKALAR GRID */
.container {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 25px;

    align-items: stretch;
}

/* KARTOCHKA */
.card {
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;

    padding: 13px;
    overflow: hidden;
    border-radius: 18px;

    color: #1e1b4b;
    background: linear-gradient(145deg, #fff, #ede9fe);

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);

    animation: appear 0.5s ease both;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

/* RASM */
.movie-img {
    display: block;
    width: 100%;
    height: 280px;
    flex-shrink: 0;

    object-fit: cover;
    border-radius: 12px;

    transition: transform 0.4s ease;
}

.card:hover .movie-img {
    transform: scale(1.03);
}

/* KINO NOMI */
.movie-name {
    font-size: 19px;
    line-height: 1.4;
    margin: 14px 0 10px;
    color: #5b21b6;
    overflow-wrap: anywhere;
}

/* TAVSIF */
.movie-summary {
    font-size: 13px;
    line-height: 1.6;
    color: #4b5563;
    margin-bottom: 12px;
}

/* MA'LUMOTLAR */
.movie-lang,
.movie-genres,
.movie-time,
.movie-country {
    font-size: 12px;
    line-height: 1.5;
    overflow-wrap: anywhere;

    padding: 8px;
    margin-bottom: 8px;
    border-radius: 8px;

    color: #4338ca;
    background: linear-gradient(90deg, #ede9fe, #fce7f3);
}

/* TUGMA DOIMO PASTDA */
.card a {
    display: block;
    width: 100%;
    margin-top: auto;
    padding: 12px 8px;
    flex-shrink: 0;

    text-align: center;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    color: white;

    border-radius: 10px;
    background: linear-gradient(135deg, #000000, #ffffff);

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}

.card a:hover {
    filter: brightness(1.15);
    transform: scale(1.02);
}

/* SPINNER */
.loading-box {
    grid-column: 1 / -1;
    min-height: 350px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;

    color: white;
    font-size: 18px;
    font-weight: bold;
}

.spinner {
    width: 65px;
    height: 65px;

    border: 6px solid rgba(255, 255, 255, 0.2);
    border-top-color: #ec4899;
    border-right-color: #a78bfa;
    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* PLANSHEТ */
@media (max-width: 1100px) {
    .container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

/* TELEFON */
@media (max-width: 750px) {
    body {
        padding: 20px 3%;
    }

    .container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
    }

    .movie-img {
        height: 230px;
    }

    .movie-name {
        font-size: 16px;
    }

    .page-title {
        font-size: 28px;
    }
}

@media (max-width: 400px) {
    .container {
        gap: 10px;
    }

    .card {
        padding: 8px;
    }

    .movie-img {
        height: 175px;
    }

    .movie-name {
        font-size: 14px;
    }

    .movie-summary {
        font-size: 12px;
    }
}

/* Harakatni kamaytirish sozlamasi */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}



.loading-box {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    min-height: 300px;
    color: white;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 6px solid #dbdbdb33;
    border-top-color: #ffffff;
    border-right-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

    </style>
</head>
<body>

    

    <div class="container">
        <div class="loading-box">
            <div class="spinner"></div>
            <p>Kinolar yuklanmoqda...</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
